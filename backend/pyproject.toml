[project]
name = "sheets-automation-backend"
version = "0.1.0"
description = "Sheets Automation Platform — backend (config compiler, validator, evaluator, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=42",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "google-api-python-client-stubs>=1.40.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
