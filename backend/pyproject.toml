[project]
name = "sheets-automation-backend"
version = "0.1.0"
description = "Sheets Automation Platform — backend (config compiler, validator, evaluator, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "cryptography>=42",
    "fastapi>=0.115",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "redis>=5",
    "rq>=1.16",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "google-api-python-client-stubs>=1.40.0",
    "pgserver>=0.1.4",
    "fakeredis[lua]>=2.38.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
